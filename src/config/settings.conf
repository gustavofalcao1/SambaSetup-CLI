# =============================================================================
# SambaSetup-CLI Global Settings
# =============================================================================

# Version Information
VERSION="2.1.4"
VERSION_NAME="Stable"
VERSION_DATE="2024-12-30"
VERSION_DESCRIPTION="Samba AD DC Management Tool"
AUTHOR="Gustavo Falcão"
REPOSITORY="https://github.com/gustavofalcao1/SambaSetup-CLI"

# System Directories
INSTALL_DIR="/home/administrator/SambaSetup-CLI"
LOGS_DIR="${INSTALL_DIR}/logs"
CONFIG_DIR="${INSTALL_DIR}/src/config"
LIB_DIR="${INSTALL_DIR}/src/lib"

# Samba Directories
SAMBA_CONF="/etc/samba/smb.conf"
SAMBA_LIB="/var/lib/samba"
SAMBA_LOG="/var/log/samba"
SAMBA_RUN="/run/samba"

# Log Files
MAIN_LOG="${LOGS_DIR}/sambasetup.log"
SAMBA_MAIN_LOG="${SAMBA_LOG}/log.samba"
ERROR_LOG="${LOGS_DIR}/error.log"
ACCESS_LOG="${LOGS_DIR}/access.log"

# Visual Settings
# Theme Colors (Green)
COLOR_PRIMARY='\033[0;32m'        # Regular green
COLOR_SECONDARY='\033[1;32m'      # Bold green
COLOR_ACCENT='\033[38;5;35m'      # Bright green
COLOR_HIGHLIGHT='\033[38;5;46m'   # Neon green
COLOR_MUTED='\033[38;5;22m'       # Dark green
COLOR_SUCCESS='\033[38;5;40m'     # Success green
COLOR_ERROR='\033[0;31m'          # Error red
COLOR_WARNING='\033[0;33m'        # Warning yellow
COLOR_INFO='\033[38;5;36m'        # Info cyan-green

# Text Styles
COLOR_RESET='\033[0m'
COLOR_BOLD='\033[1m'
COLOR_DIM='\033[2m'
COLOR_UNDERLINE='\033[4m'
COLOR_BLINK='\033[5m'
COLOR_REVERSE='\033[7m'
COLOR_HIDDEN='\033[8m'

# Menu Styles
HEADER_STYLE="================================================================"
SUBMENU_STYLE="----------------------------------------------------------------"
MENU_INDENT="  "

# Default Samba Settings
DEFAULT_REALM="DOMAIN.LOCAL"
DEFAULT_WORKGROUP="DOMAIN"
DEFAULT_NETBIOS_NAME="SV-DOMAIN"
DEFAULT_DNS_FORWARDER="1.1.1.1"

# Backup Settings
BACKUP_RETENTION_DAYS=30
BACKUP_DIR="${INSTALL_DIR}/backups"

# Service Settings
SAMBA_SERVICE="samba-ad-dc"
WINBIND_SERVICE="winbind"

# Editor Settings
DEFAULT_EDITOR="nano"
